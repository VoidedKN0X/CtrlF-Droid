# F-Droid repo settings. Secrets come from GitHub Actions; nothing secret is stored here.
repo_url: https://voidedkn0x.github.io/CtrlF-Droid/repo
repo_name: CtrlF-Droid
repo_icon: icon.png
repo_description: >-
  The VKNXWorks Ctrl series: free and open-source Android apps for self-hosted
  services like Jellyfin, Immich, Navidrome, Frigate, Seerr, Matrix, Paperless-ngx,
  Proxmox VE, TrueNAS, the *arr apps, Bambuddy and Spoolman.
  Updated automatically from each app's GitHub releases.

archive_older: 0

# Signing. The keystore file is written by the workflow from the
# REPO_KEYSTORE_BASE64 secret and deleted afterwards. The password and alias are
# read from environment variables (set from Actions secrets/variables), so no
# secret is ever written into this file. sdk_path defaults to $ANDROID_HOME.
keystore: keystore.p12
repo_keyalias: {env: REPO_KEY_ALIAS}
keystorepass: {env: REPO_KEYSTORE_PASSWORD}
keypass: {env: REPO_KEYSTORE_PASSWORD}
