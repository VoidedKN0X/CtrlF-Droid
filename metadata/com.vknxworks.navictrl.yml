Name: NaviCtrl
Summary: Music player for Navidrome servers
Description: |
  A full music player for self-hosted Navidrome servers.

  * All your songs in one list, A to Z or by date added
  * Endless Shuffle all
  * Favourites for songs, albums and artists
  * Background playback, synced lyrics and sleep timer
  * Downloads for offline listening
  * Scrobbling to Last.fm and ListenBrainz through Navidrome
