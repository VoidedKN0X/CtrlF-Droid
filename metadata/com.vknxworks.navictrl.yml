Name: NaviCtrl
Summary: Music player for Navidrome servers
Description: |
  A full music player for self-hosted Navidrome servers.

  * Songs tab with your whole library, A to Z or by date added
  * Shuffle all (an endless random queue) and a Favourites tab for songs, albums and artists
  * Playlists tab: play, shuffle, download, create, rename, delete and edit your Navidrome playlists
  * Background playback with lock screen and Bluetooth controls
  * Gapless playback, crossfade, ReplayGain and an equalizer
  * Synced lyrics, sleep timer and mixes of similar songs
  * Reorderable up-next queue that survives a restart, and continue a queue from another device
  * Downloads for offline listening and a cache of played songs
  * Scrobbling to Last.fm and ListenBrainz through Navidrome
  * Album and artist pages, search and Add to playlist
  * Several servers and accounts; separate Wi-Fi and mobile data quality
  * App lock with its own PIN and optional fingerprint unlock

  Needs a Navidrome server, and Android 13 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: NaviCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

