Name: TextCtrl
Summary: Texts and picture messages (SMS and MMS), private and Google-free
Description: |
  An SMS and MMS app that becomes your phone's texting app, with no internet access, no tracking and nothing from Google.

  * Texts (SMS) and picture messages (MMS), arriving the moment your phone receives them
  * Group chats as one group picture message, or separate texts if you prefer
  * Pictures, videos and files: attach up to 5, with pictures shrunk to fit your carrier's limit; view, save or share received pictures
  * Contact cards: send a contact, and add a received one with Add to contacts
  * Scheduled messages (hold the send button), also across a restart, and Undo send
  * Reactions that work with iPhones and Google Messages over plain SMS
  * Copy one-time codes straight from the message or its notification
  * Notifications with Reply and Mark as read, per-chat mute and sound, and a choice of what they show
  * Pin, archive, mute, hide, block and delete chats, mark as read or unread, and select several at once
  * Swipe actions you choose, with Undo for archive, delete and block
  * Filters for unread chats and unknown senders, and your own spam and keyword filters with a Spam folder
  * Hidden chats behind a PIN of their own
  * Search all your messages, one person's, or inside a chat
  * Delete old messages automatically, for everything or per chat
  * Encrypted backup and restore to a file you keep, and import and export of SMS Backup & Restore XML files
  * Dual SIM with a SIM per chat, optional delivery reports, retry for messages that didn't go out, and a counter for long texts
  * Blocked numbers using Android's own block list, drafts per chat, "Text this number" and Share to TextCtrl from other apps, and reply with a message when you decline a call
  * Your own bubble colour and text size, a recent chats widget, and chat list and chat side by side on tablets and foldables
  * App lock with PIN and fingerprint (drafts stay encrypted while locked), and Hide in screenshots / Hide in recent apps

  Permissions: send, receive and read texts and receive picture messages (granted when you make TextCtrl your SMS app), contacts (optional, names and pictures), phone (optional, your SIMs and your own numbers), notifications, exact alarms and run at startup (scheduled messages and auto-delete) and biometrics (only for fingerprint unlock). No internet or network permission. Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google libraries, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. TextCtrl has no internet permission at all, so it never connects to any server. Texts go out over the mobile network through your phone, and picture messages are sent and fetched by Android's own MMS service with your carrier.

  Open source and built in the open: TextCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

