Name: PrintCtrl
Summary: Bambu Lab printers through Bambuddy, and Spoolman spools
Description: |
  Your Bambu Lab printers and filament spools, from your self-hosted Bambuddy and Spoolman servers.

  * Live printer status, progress and time left, with temperature graphs
  * Live camera with full screen, zoom and saving pictures
  * Print controls: pause, resume, stop, speed, light, fans, temperatures, jog, filament, skip parts
  * AMS slots with filament and linked spool, and AMS drying on units that can dry
  * Printer messages (HMS) with Bambu's explanation, and Obico failure detection
  * Queue, file library, projects, server slicing and share-to-print
  * Print archive with timelapses, statistics and costs per month
  * Spool inventory (Spoolman or Bambuddy's own) with weigh-ins, QR and NFC scanning and low-stock alerts
  * Progress notification (Live Update on Android 16), first-layer check and alerts via polling or ntfy
  * Home-screen widget and Quick Settings tile
  * Two addresses per server (you pick which one is used), self-signed certificates trusted by fingerprint, settings backup
  * App lock with its own PIN and fingerprint, and private on the lock screen

  Works with Bambuddy, Spoolman, or both. Needs Android 15 or newer on a 64-bit ARM phone. Unofficial app, not affiliated with Bambu Lab, Bambuddy or Spoolman.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: PrintCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

