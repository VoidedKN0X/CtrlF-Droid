Name: PrintCtrl
Summary: Bambu Lab printers through Bambuddy, and Spoolman spools
Description: |
  Your Bambu Lab printers and filament spools, from your self-hosted Bambuddy and Spoolman servers.

  * Live printer status, progress and time left, with temperature graphs
  * Live camera with full screen, zoom and saving pictures
  * Print controls: pause, resume, stop, speed, light, fans, temperatures, jog, filament, skip parts
  * AMS slots with filament and linked Spoolman spool
  * Queue, file library, server slicing and share-to-print
  * Print archive with timelapses, statistics and costs per month
  * Spoolman inventory with weigh-ins, QR and NFC scanning and low-stock alerts
  * Progress notification (Live Update on Android 16), first-layer check and alerts via polling or ntfy
  * Home-screen widget and Quick Settings tile
  * Two addresses per server (you pick which one is used) and self-signed certificates trusted by fingerprint
  * Private on the lock screen; works with Bambuddy, Spoolman or both

  Works with Bambuddy, Spoolman, or both. Unofficial app, not affiliated with Bambu Lab, Bambuddy or Spoolman.

  Google-free: no Google Play services or Google libraries that contact Google.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

