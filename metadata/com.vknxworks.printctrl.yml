Name: PrintCtrl
Summary: Bambu Lab printers through Bambuddy, and Spoolman spools
Description: |
  Your Bambu Lab printers and filament spools, from your self-hosted Bambuddy and Spoolman servers.

  * Live printer status, progress and time left, with Bambuddy's shared camera stream
  * Pause, resume, stop, speed, light, fans, heater targets, filament load and unload
  * AMS and AMS lite slots, printer messages (HMS) and AI failure detection
  * Print queue, file library with plate and AMS slot choice, and slicing on the server
  * Print history with timelapses and statistics
  * Spoolman inventory with weigh-in, QR label and NFC tag scanning
  * Progress notification and alerts without Google services (background checks or ntfy/UnifiedPush)
  * Home-screen widget and Quick Settings tile

  Works with Bambuddy, Spoolman, or both. Unofficial app, not affiliated with Bambu Lab, Bambuddy or Spoolman.

