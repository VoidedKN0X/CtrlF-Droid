Name: PaperCtrl
Summary: Scan paper into Paperless-ngx and browse your documents
Description: |
  Scan paper into your self-hosted Paperless-ngx server and browse your documents.

  * Document scanner with edge detection, auto-capture, multi-page and filters
  * Title, tags, correspondent and ASN before uploading, with ASN label scanning
  * Upload queue that works offline, and Share to PaperCtrl from any app
  * Inbox with swipes and Paperless suggestions
  * Documents with full-text search, filters, saved views and bulk editing
  * Document viewer with notes, history and share links
  * Organise tags, correspondents, types, storage paths, custom fields and trash
  * Notifications, daily inbox reminder and ntfy push from Paperless
  * Widget, quick settings tile and shortcuts to scan
  * Several servers, two-factor sign-in, app lock and screenshot blocking

  Needs a 64-bit ARM phone. Unofficial app, not affiliated with Paperless-ngx.

  Google-free: no Google Play services or Google libraries that contact Google.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

