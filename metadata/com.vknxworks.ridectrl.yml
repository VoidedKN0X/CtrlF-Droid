Name: RideCtrl
Summary: Offline maintenance, fuel and mod log for your scooter, motorbike or car
Description: |
  An offline log for everything about your vehicles: fuel and consumption, premix, services and when the next one is due, parts, mods, temperature readings and documents. Made first for 2-stroke scooters, but it works for any vehicle.

  * Garage with a dashboard per vehicle: odometer, next maintenance, consumption, cost per km and quick-add buttons
  * Fuel log with consumption between full tanks, cost per km, monthly and yearly spend and charts
  * Premix calculator for the pump, with the reverse (how much fuel your oil is good for)
  * Maintenance with your own km and time intervals (a scooter list to start from, intervals blank), service records and an OK / soon / overdue list
  * Local reminders for maintenance (by date, and by km from your average riding) and document expiry
  * Parts inventory with stock that follows what you use, mods log with before/after photos, and a specs sheet with your own values
  * Temperature log with charts and min/avg/max per setup, to compare jetting or exhaust changes
  * Odometer history and trips (no GPS), documents with photos, notes and total cost of ownership
  * Backup to one file (optionally encrypted with a password) and CSV export
  * Home-screen widget and app shortcuts: Add fuel, Premix calculator, Add temp reading
  * km or miles, litres or gallons, °C or °F and your currency
  * App lock with PIN and fingerprint; while locked, the widget and reminders don't show any details

  Permissions: notifications (reminders), run at startup (to re-arm the daily check) and biometrics (only for fingerprint unlock). No internet, camera or storage permission. Needs Android 13 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google libraries, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. RideCtrl has no internet permission at all, so it never connects to anything.

  Open source and built in the open: RideCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

