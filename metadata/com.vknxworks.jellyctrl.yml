Name: JellyCtrl
Summary: Movies, shows, music and Live TV from Jellyfin
Description: |
  A native Android app for Jellyfin.

  * Media3 player with automatic mpv fallback for difficult formats and subtitles
  * Home with Continue watching, Next up and latest per library
  * Skip intro, recap and credits, next-episode autoplay and scrubbing previews
  * Music with background playback, queue, shuffle and synced lyrics
  * Live TV with channels, guide, recordings and scheduled recordings
  * Downloads for offline watching
  * Remote control for your other Jellyfin devices
  * Full admin dashboard, protected from screenshots
  * Server discovery, Quick Connect and several accounts
  * Picture-in-picture, gestures and a mobile-data quality limit

  Needs Jellyfin 10.9 or newer.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

