Name: MapsCtrl
Summary: Private, offline maps and turn-by-turn navigation
Description: |
  Maps and navigation that work offline: download the maps you need once, and search, routing and navigation run on your phone. MapsCtrl has its own map style and uses OpenStreetMap data, drawn with Mapsforge and routed with BRouter.

  * Offline vector maps of any country or region, in MapsCtrl's own day and night style
  * Offline search by name, address, category and coordinates
  * Routes by car, bike and on foot, worked out on the phone
  * Turn-by-turn navigation with spoken directions, speed limits, speed camera warnings and rerouting
  * Saved places, track recording, GPX import and export
  * Optional ETA sharing through your own ntfy server (off by default; never your position)

  Permissions: location (only on the phone, never sent anywhere), internet (only to download the maps, search data and routing data you choose, and for ntfy if you turn it on), and a location foreground service for navigation and track recording. Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or Google location library, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. Your location, searches and routes never leave the phone.

  Open source and built in the open: MapsCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.
