Name: MapsCtrl
Summary: Private, offline maps and turn-by-turn navigation
Description: |
  Maps and navigation that work offline: download the maps you need once, and search, routing and navigation run on your phone. Built on the open-source Organic Maps engine with OpenStreetMap data.

  * Offline maps of every country and region
  * Turn-by-turn navigation for car, walking, cycling and public transport, with voice, lanes and speed limits
  * Speed camera warnings
  * Offline search, bookmarks and tracks (KML, KMZ, GPX)
  * Hiking and cycling maps with contour lines and hillshading
  * Android Auto

  Permissions: location (only on the phone, never sent anywhere), internet and network state (only to download maps), a foreground service and notifications (navigation and downloads), start at boot. Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. Your location, searches and routes never leave the phone; no Google or microG location library is included.

  Open source and built in the open: MapsCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

