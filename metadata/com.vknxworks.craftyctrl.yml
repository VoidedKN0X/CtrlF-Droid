Name: CraftyCtrl
Summary: Manage Minecraft servers on Crafty Controller
Description: |
  Manage your Minecraft servers on a self-hosted Crafty Controller 4 panel.

  * Server list with live CPU, memory, players and uptime
  * Start, restart, stop and kill, with an optional in-game countdown
  * Live console with search, filters and quick commands
  * Server settings, whitelist, operators, bans, plugins and mods
  * File browser with a text editor
  * Backups and scheduled tasks
  * Alerts when a server stops or crashes

  Needs Crafty Controller 4.x reachable over HTTPS. Unofficial app, not affiliated with the Crafty Controller team.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

