Name: ProxCtrl
Summary: Manage your Proxmox VE server
Description: |
  Manage your Proxmox VE 8 or 9 server from your phone: a fast, touch-first alternative to the web UI.

  * Overview of your node, with an attention list for full disks, high memory, failed backups and more
  * Guests: all your containers and VMs with CPU, memory and disk use, tags, search, sorting and bulk start/stop
  * Guest pages with graphs, power controls, console, snapshots, backups and restore
  * Storage: storages, backups, ISOs and templates, disks with SMART health, ZFS and LVM
  * Tasks with live logs
  * Node: services, updates, network and a shell
  * Notifications without Google services: polling, or UnifiedPush through your own ntfy
  * Widgets and a Quick Settings tile
  * Safe by design: read-only mode that blocks every change, confirmation before bulk actions, certificate pinning and screenshot protection

  Unofficial app, not affiliated with Proxmox Server Solutions.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

