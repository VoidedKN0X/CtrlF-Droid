Name: ProxCtrl
Summary: Monitor your Proxmox VE node and manage containers and VMs
Description: |
  Manage your Proxmox VE 8 or 9 server from your phone: a fast, touch-first alternative to the web UI.

  * Overview with live node graphs and a needs-attention list
  * All containers and VMs with usage, tags, search, sorting and bulk power actions
  * Guest pages with graphs, power controls, IP addresses and notes
  * Consoles for containers and VMs, and a node shell
  * Snapshots, backups and restore, confirmed by typing the guest ID
  * Notifications without Google: background checks or UnifiedPush via ntfy
  * Several servers, API token or password with two-factor
  * Read-only mode, certificate pinning and screenshot protection

  Unofficial app, not affiliated with Proxmox Server Solutions.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

