Name: ArrCtrl
Summary: One app for your self-hosted Radarr, Sonarr, qBittorrent and the rest
Description: |
  One app for your whole self-hosted download stack: Radarr, Sonarr, Prowlarr, Bazarr, qBittorrent, autobrr and Cleanuparr.

  * Radarr movies and Sonarr series with search, monitoring, renaming and bulk edits
  * Calendar of upcoming movies and episodes
  * Activity: queues with manual import, qBittorrent torrents and history
  * Add torrents from magnet links and .torrent files
  * Bazarr subtitles in any language for every movie and episode
  * Prowlarr, autobrr and Cleanuparr tools, and System health with disk space warnings
  * Notifications without Google: background checks or UnifiedPush via ntfy
  * Upcoming and Downloads widgets, and a tile for qBittorrent's alternative speed limits
  * Several servers of each type, imported by paste or QR code
  * Self-signed certificates trusted by fingerprint, encrypted API keys

  Unofficial app, not affiliated with any of these projects.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

