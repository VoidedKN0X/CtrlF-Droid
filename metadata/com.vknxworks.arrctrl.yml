Name: ArrCtrl
Summary: One app for your self-hosted Radarr, Sonarr, qBittorrent and the rest
Description: |
  One app for your whole self-hosted download stack: Radarr, Sonarr, Lidarr, Prowlarr, Bazarr, qBittorrent, autobrr and Cleanuparr.

  * Radarr movies, Sonarr series and Lidarr music with search, monitoring, renaming and bulk edits
  * Wanted: missing and cutoff-unmet lists with search
  * Calendar of upcoming movies, episodes and album releases
  * Activity: queues with manual import, qBittorrent torrents with full controls, and history
  * Add torrents from magnet links and .torrent files
  * Bazarr subtitles in any language for every movie and episode
  * Prowlarr, autobrr and Cleanuparr tools, and System health with disk space warnings
  * Notifications through ntfy, with the app's own background checks as a fallback
  * Upcoming and Downloads widgets, and a tile for qBittorrent's alternative speed limits
  * Several servers of each type, every service optional, imported by paste or QR code
  * App lock with its own PIN and fingerprint, encrypted API keys, and self-signed certificates trusted by fingerprint

  Needs Android 13 or newer on a 64-bit ARM phone. Unofficial app, not affiliated with any of these projects.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: ArrCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

