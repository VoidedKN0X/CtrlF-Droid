Name: TrueCtrl
Summary: Monitor your TrueNAS pools, disks, scrubs and alerts from your phone
Description: |
  Monitor and manage your TrueNAS server (25.04 or newer) from your phone: a fast, touch-first alternative to the web UI.

  * Overview with a needs-attention list, system card and live graphs
  * Live alerts with dismiss and restore
  * Pools with health, space and layout
  * Start, pause, resume and stop scrubs with live progress
  * Disks with temperatures, graphs and SMART health
  * Several servers, API key or password with two-factor
  * Read-only mode, certificate pinning and screenshot blocking

  Needs HTTPS on your TrueNAS (a self-signed certificate is fine). Unofficial app, not affiliated with iXsystems.

  Google-free: no Google Play services or Google libraries that contact Google.

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

