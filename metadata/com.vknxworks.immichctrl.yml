Name: ImmichCtrl
Summary: Photos and backup for your Immich server
Description: |
  A native Android app for self-hosted Immich photo servers (2.x and 3.x).

  * Fast timeline grouped by day or month, with your phone's photos mixed in
  * Automatic backup with Wi-Fi-only and charging-only options, album sync and free up space
  * Memories, slideshows and live updates from other devices
  * Viewer with editing, text from photos, faces, stacks and date/location changes
  * Albums, shared albums, offline albums and duplicate review
  * People, places, map, tags, folders, archive, trash and locked folder
  * Smart search with filters
  * Shared links and partner sharing
  * App lock, read-only mode, location removal when sharing, Show maps switch
  * Home screen widgets and a Quick Settings backup tile
  * Home and public address: you choose which one the app uses; it never switches by itself
  * Admin tools: users, jobs, storage and server alerts

  Google-free: no Google Play services or Google libraries that contact Google.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

