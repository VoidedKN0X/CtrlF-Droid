Name: CameraCtrl
Summary: Private camera with RAW (DNG) on every lens, detected on your phone
Description: |
  A camera for people who want the sensor's own data. CameraCtrl asks your phone which camera modes it offers, lens by lens, and lets you shoot RAW (DNG) on every lens that has it.

  * RAW16, RAW12 and RAW10 saved as DNG; RAW + JPEG, RAW only or JPEG
  * Maximum resolution mode where Android offers it
  * Every lens: the multi-camera with pinch zoom and each physical lens
  * Camera modes page listing everything each lens offers
  * Pro controls: ISO, shutter, focus, white balance, exposure compensation
  * Tap to focus, grid, timer, torch; 4K or 1080p video in HEVC or H.264

  Permissions: camera, microphone (optional, for video sound), biometrics (app lock). No internet and no location: no photo ever carries your position. Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. CameraCtrl has no internet permission at all.

  Open source and built in the open: CameraCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

