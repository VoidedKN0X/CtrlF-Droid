Name: GalleryCtrl
Summary: Private, offline gallery with an encrypted vault and no trash bin
Description: |
  A gallery for the photos and videos on your phone, where they already are. No cloud, no account and no AI service; private photos go in an encrypted vault, and what you delete is gone for good.

  * Photos grouped by day, On this day, albums for every folder, Favourites and Videos
  * Viewer with zoom (sharper as you zoom on large photos), Ultra HDR, video playback and slideshows
  * Info with camera, lens, exposure and location; search by name, folder or date
  * Share without your location (on by default)
  * Duplicate finder that keeps the best photo
  * Encrypted vault (AES-256-GCM, key in the phone's secure hardware), optionally behind your PIN
  * Delete means deleted: no trash bin
  * Edit in LumenCtrl or any editor

  Permissions: photos and videos (all, or only the ones you pick), media location (shown on the phone only, and removed from shared copies), biometrics (app lock). No internet and no "all files" access. Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. GalleryCtrl has no internet permission at all.

  Open source and built in the open: GalleryCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

