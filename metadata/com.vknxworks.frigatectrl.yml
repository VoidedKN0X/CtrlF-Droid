Name: FrigateCtrl
Summary: Watch and review your Frigate NVR cameras
Description: |
  Watch and review your self-hosted Frigate NVR cameras.

  * Camera grid with live snapshots, camera groups and new-alert badges
  * Live view about one second behind, with sound, zoom and picture-in-picture
  * Two-way talk on cameras with a speaker
  * PTZ controls: joystick, zoom, focus and presets
  * History with a precise pinch-to-zoom timeline of recordings, motion and alerts
  * Events list: swipe to mark reviewed, filter by unreviewed or alerts
  * Save or share clips of any event or time range, and server exports (real time or time-lapse)
  * Alert notifications per camera and object, from background checks or instant push through your own ntfy server
  * Camera switches: on/off, detection, recording, snapshots, audio detection, notifications
  * System health: CPU, GPU, memory, detectors, camera FPS and storage
  * App lock with PIN and fingerprint, optional hiding from screenshots and recents, and self-signed certificates pinned by fingerprint

  Needs Frigate 0.14 or newer (go2rtc for live video), and Android 13 or newer on a 64-bit ARM phone. Unofficial app, not affiliated with the Frigate project.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: FrigateCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

