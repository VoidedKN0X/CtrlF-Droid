Name: BeamCtrl
Summary: TV remote for phones with an IR blaster
Description: |
  Turn your phone's infrared (IR) blaster into a TV remote.

  * Ready-made remotes for Samsung, LG, Sony, Philips and Vizio TVs
  * Find my TV: tries each brand's power code until your TV responds
  * Import Flipper Zero .ir files, or build a remote button by button
  * Full TV layout with d-pad, volume, channels, playback keys and a number pad
  * Supports NEC, Samsung, Sony SIRC, Philips RC5/RC6, Pronto hex and raw codes
  * Backup and restore all remotes

  Needs a phone with a built-in IR blaster.

