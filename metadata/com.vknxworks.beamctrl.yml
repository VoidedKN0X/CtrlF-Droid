Name: BeamCtrl
Summary: Turn your phone's IR blaster into a TV remote that works offline
Description: |
  Turn your phone's infrared (IR) blaster into a TV remote.

  * Code library with 8,500+ remotes, built in and offline
  * Try every button before you save a remote
  * Turn off any TV by cycling every TV power code
  * Ready-made Samsung, LG, Sony, Philips and Vizio remotes, plus Find my TV
  * Import and export Flipper Zero .ir files, edit any remote, or build one button by button
  * Full TV layout with hold-to-repeat volume, channel and arrow keys
  * NEC, Samsung, Sony SIRC, RC5/RC6, Pronto and raw codes
  * Backup and restore all remotes as one file
  * App lock with its own PIN and optional fingerprint unlock
  * Dark and light themes that follow your phone, tablet and foldable layout

  Needs a phone with a built-in IR blaster, with Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind. BeamCtrl has no internet permission at all, so it never connects to anything.

  Open source and built in the open: BeamCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

