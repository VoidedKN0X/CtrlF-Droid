Name: BeamCtrl
Summary: Turn your phone's IR blaster into a TV remote, fully offline
Description: |
  Turn your phone's infrared (IR) blaster into a TV remote.

  * Code library with 8,500+ remotes, built in and offline
  * Try every button before you save a remote
  * Turn off any TV by cycling every TV power code
  * Ready-made Samsung, LG, Sony, Philips and Vizio remotes, plus Find my TV
  * Import and export Flipper Zero .ir files, or build a remote button by button
  * Full TV layout with hold-to-repeat volume, channel and arrow keys
  * NEC, Samsung, Sony SIRC, RC5/RC6, Pronto and raw codes
  * Backup and restore all remotes as one file
  * Light, dark and pure black themes, Material You, tablet layout

  Needs a phone with a built-in IR blaster.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

