Name: ChatCtrl
Summary: Matrix chat for matrix.org and self-hosted servers, with E2EE
Description: |
  A Matrix chat client in the spirit of Element X, built on the Matrix Rust SDK.

  * Works with matrix.org, public servers or your own homeserver
  * Sign in with OAuth, password, single sign-on or a QR code, and link a new device by QR code
  * End-to-end encryption with device verification and key backup
  * Replies, threads, reactions, edits, polls, voice messages, files and locations on an OpenStreetMap map
  * Search inside chats, including encrypted ones, and a media and files page for each chat
  * Push notifications through ntfy, with a background check as a fallback
  * Voice and video calls through your own server (MatrixRTC/Element Call, works with Element X and Element Web)
  * Link previews, drafts and six chat bubble styles
  * Create rooms, direct chats, explore public rooms, moderation
  * Device list, and app lock with its own PIN and optional fingerprint
  * Two-pane layout on tablets and foldables

  Needs a server with Simplified Sliding Sync (Synapse 1.114 or newer, Conduit, Conduwuit or Tuwunel), and Android 13 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: ChatCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

