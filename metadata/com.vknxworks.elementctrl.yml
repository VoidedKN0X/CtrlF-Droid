Name: ElementCtrl
Summary: Matrix chat for matrix.org and self-hosted Synapse
Description: |
  A Matrix chat client in the spirit of Element X, built on the Matrix Rust SDK.

  * matrix.org, other public servers or your own server
  * Sign in with OAuth, password or single sign-on
  * End-to-end encryption with verification and key backup
  * Replies, threads, reactions, polls, voice messages, images and files
  * Search inside chats, including encrypted ones
  * Push notifications through ntfy (UnifiedPush), no Google services needed
  * Two-pane layout on tablets and foldables

  Needs a server with Simplified Sliding Sync (Synapse 1.114 or newer). 64-bit ARM only.

