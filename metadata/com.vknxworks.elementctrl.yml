Name: ElementCtrl
Summary: Matrix chat for matrix.org and self-hosted servers, with E2EE
Description: |
  A Matrix chat client in the spirit of Element X, built on the Matrix Rust SDK.

  * Works with matrix.org, public servers or your own homeserver
  * Sign in with OAuth, password or single sign-on
  * End-to-end encryption with device verification and key backup
  * Replies, threads, reactions, edits, polls, voice messages and files
  * Search inside chats, including encrypted ones
  * Push notifications through ntfy (UnifiedPush), no Google services
  * Link previews, drafts and six chat bubble styles
  * Create rooms, direct chats, explore public rooms, moderation
  * Device list and app lock with PIN and fingerprint
  * Two-pane layout on tablets and foldables

  Needs a server with Simplified Sliding Sync (Synapse 1.114 or newer). 64-bit ARM only.

  Google-free: no Google Play services or Google libraries that contact Google.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

