Name: SoundCtrl
Summary: Private app for JBL headphones and speakers, without the account
Description: |
  One app for JBL headphones, earbuds and speakers, over Bluetooth, without a Harman account.

  * Battery (buds and case), model and firmware version
  * Noise control (ANC, Ambient, TalkThru), gestures, auto-off, voice prompts
  * Speakers: rename, PartyBoost and Auracast, stereo, Find
  * Firmware updates for supported speakers and headphones, checked by MD5 and by the device

  Permissions: Bluetooth scan (not used for location) and connect, internet (only for the update check and download from Harman's public file server, sending only the product id), a foreground service and notifications (during an update), biometrics (app lock). Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: SoundCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

