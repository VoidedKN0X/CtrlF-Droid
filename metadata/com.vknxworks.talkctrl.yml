Name: TalkCtrl
Summary: Private app for Cardo intercoms: settings, FM radio and firmware updates
Description: |
  Controls Cardo motorcycle intercoms (Packtalk, Freecom, Spirit) over Bluetooth, without a Cardo account.

  * Battery, firmware version, rename
  * Volumes, automatic volume, EQ, music sharing, voice prompts and microphone settings
  * FM radio: tune, seek, scan, presets
  * Intercom pairing, conference, speed dial and mesh groups
  * Profiles for solo, duo and group riding
  * Firmware updates over Bluetooth (GAIA); the intercom checks Cardo's signature

  Permissions: Bluetooth scan (not used for location) and connect, internet (only for the firmware check and download from Cardo's update server, sending only the model), a foreground service and notifications (during an update), biometrics (app lock). Needs Android 15 or newer on a 64-bit ARM phone.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: TalkCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

