Name: FilesCtrl
Summary: File manager with NFS, SMB, SFTP, FTP and WebDAV
Description: |
  A Material You file manager with network storage built in.

  * Local storage, SD cards and USB drives
  * NFS (v3 and v4), SMB, SFTP, FTP/FTPS and WebDAV from one Add network button
  * Open network files in any app; videos stream without downloading first
  * Your servers show up in the system file picker
  * Copy, move, rename and delete between your phone and any server
  * Zip and unzip, search, bookmarks and a built-in text editor

  No root needed.

