Name: FilesCtrl
Summary: File manager with NFS, SMB, SFTP, FTP and WebDAV built in
Description: |
  A Material You file manager with network storage built in.

  * Internal storage, SD cards and USB drives
  * NFS v3/v4, SMB 2/3, SFTP, FTP/FTPS and WebDAV from one Add network button
  * Stream and open network files in any app
  * Your servers in the Android file picker
  * Background copy, move, rename and delete between phone and servers
  * Zip and unzip, multi-select, search and bookmarks
  * Built-in text editor
  * Read-only servers and fingerprint-checked connections
  * Encrypted passwords and app lock with PIN and fingerprint
  * Light, dark and pure black themes, tablet layout

  No root needed.

  Google-free: no Google Play services or Google libraries that contact Google.

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

