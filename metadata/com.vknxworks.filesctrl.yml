Name: FilesCtrl
Summary: File manager with NFS, SMB, SFTP, FTP and WebDAV built in
Description: |
  A file manager with network storage built in.

  * Internal storage, SD cards and USB drives
  * NFS v3/v4, SMB 2/3, SFTP, FTP/FTPS and WebDAV from one Add network button
  * Stream and open network files in any app, and your servers in the Android file picker
  * Background copy, move, rename and delete between phone and servers
  * Open ZIP, 7z, RAR, TAR and more like folders, and compress to ZIP, 7z or TAR with optional AES-256 passwords
  * Tabs, and two folders side by side on tablets, foldables and in landscape
  * Picture viewer, also for photos on servers and in archives
  * Save to FilesCtrl from any app's share sheet
  * Checksums, multi-select, search, bookmarks and home screen shortcuts
  * Built-in text editor
  * Read-only servers and fingerprint-checked connections
  * Encrypted passwords and app lock with PIN and fingerprint; dark and light themes that follow your phone

  Needs Android 13 or newer on a 64-bit ARM phone. No root needed; all files access is only for your phone's own storage.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: FilesCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

