Name: SeerrCtrl
Summary: Request movies and shows on Seerr / Jellyseerr
Description: |
  Discover, request and manage movies and series on your self-hosted Seerr, Jellyseerr or Overseerr server.

  * Sign in with Jellyfin/Emby (Quick Connect), Plex or a Seerr account
  * Discover with the web UI's sliders and filters, plus search
  * Title pages with ratings, cast, collections, recommendations and a Play button for your media server
  * Request movies and series, in 4K too, with season picking and advanced options
  * Approve or decline requests with a swipe
  * Notifications for your requests and issues, instant through ntfy, with Approve/Decline for managers (not while the app lock is on)
  * Upcoming calendar, Watchlist and Profile
  * Report, comment on and resolve issues
  * Full admin: users, permissions, quotas, blocklist, Radarr/Sonarr, jobs and settings
  * App lock with PIN and fingerprint; tablet and foldable layout
  * Private by default: titles hidden in lock-screen notifications, no Gravatar or Plex pictures unless you turn them on, and optional hiding from screenshots

  Needs Android 15 or newer on a 64-bit ARM phone. Unofficial app, not affiliated with the Seerr, Jellyseerr or Overseerr projects.

  Google-free and de-Googled: no Google Play services, Firebase or other Google services, and the app never contacts Google. It works the same on de-Googled phones (GrapheneOS, CalyxOS, /e/OS, LineageOS without Google apps).

  Telemetry-free: no analytics, crash reporting, usage stats or tracking of any kind.

  Open source and built in the open: SeerrCtrl is a one-person project by VoidedKN0X, much of it written with the help of AI (Claude). Every release is built from the public code by GitHub Actions and signed with the same key.

