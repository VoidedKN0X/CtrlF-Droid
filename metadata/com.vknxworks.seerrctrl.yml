Name: SeerrCtrl
Summary: Request movies and shows on Seerr / Jellyseerr
Description: |
  Discover, request and manage movies and series on your self-hosted Seerr, Jellyseerr or Overseerr server.

  * Sign in with Jellyfin/Emby, Plex or a Seerr account
  * Discover with the same sliders and filters as the web UI
  * Request in HD or 4K, with season picking
  * Swipe to approve or decline requests
  * Notifications with Approve/Decline buttons
  * Upcoming calendar, issues and full admin settings

  Unofficial app, not affiliated with the Seerr, Jellyseerr or Overseerr projects.

  Optional anonymous usage stats, off unless you say yes: if you opt in, the app sends which screens and features you use (never names, addresses, accounts or content) to VKNXWorks' own self-hosted server. See the app's README for the full list.

