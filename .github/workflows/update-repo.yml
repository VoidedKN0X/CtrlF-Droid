name: Update F-Droid repo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 3 hours, so new app releases show up without any manual step
    - cron: "23 */3 * * *"

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Never build or publish two repo indexes at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install F-Droid tools
        # Pinned: this job holds the repo signing key.
        run: pip install fdroidserver==2.4.5 qrcode==8.2

      - name: Download and check the latest APK and release notes of every app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repo/icons
          cp assets/icon.png repo/icons/icon.png
          failed=0
          while read -r app; do
            if ! [[ "$app" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Bad line in apps.txt: $app"
              failed=1
              continue
            fi
            echo "::group::$app"
            dl="$RUNNER_TEMP/dl/${app#*/}"
            rm -rf "$dl" && mkdir -p "$dl"
            if ! gh release download --repo "$app" --pattern '*.apk' --dir "$dl"; then
              echo "::warning::No APK found in the latest release of $app"
              echo "::endgroup::"
              continue
            fi
            # The release notes become the app's "What's new" in F-Droid clients.
            gh release view --repo "$app" --json body --jq .body > "$RUNNER_TEMP/notes.md" || : > "$RUNNER_TEMP/notes.md"
            for apk in "$dl"/*.apk; do
              # Checks package name, source repo and signing certificate, then
              # moves the APK into repo/ under a safe name.
              python scripts/add_apk.py "$app" "$apk" "$RUNNER_TEMP/notes.md" repo || failed=1
            done
            echo "::endgroup::"
          done < <(grep -v '^#' apps.txt | sed '/^$/d')
          if [ "$failed" != 0 ]; then
            echo "::error::An APK failed its checks. Nothing was signed or published; the current repo stays live."
            exit 1
          fi
          ls -la repo

      - name: Set up the repo signing key
        env:
          REPO_KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ vars.REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$REPO_KEYSTORE_BASE64" ] || [ -z "$REPO_KEYSTORE_PASSWORD" ] || [ -z "$REPO_KEY_ALIAS" ]; then
            echo "::error::Missing REPO_KEYSTORE_BASE64 / REPO_KEYSTORE_PASSWORD secrets or the REPO_KEY_ALIAS variable"
            exit 1
          fi
          umask 077
          chmod 600 config.yml  # fdroid wants this whenever config.yml names a password, even via env
          printf '%s' "$REPO_KEYSTORE_BASE64" | base64 -d > keystore.p12
          # The password is read from the environment, never put on the command line.
          FP=$(keytool -exportcert -alias "$REPO_KEY_ALIAS" -keystore keystore.p12 \
                 -storetype PKCS12 -storepass:env REPO_KEYSTORE_PASSWORD \
               | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "Repo fingerprint: $FP"

      - name: Build and sign the repo index
        # config.yml reads the password and alias from these variables.
        env:
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ vars.REPO_KEY_ALIAS }}
        run: |
          set -o pipefail
          if ! fdroid update --use-date-from-apk --pretty 2>&1 | tee "$RUNNER_TEMP/fdroid.log"; then
            # Surface the reason as an annotation (fdroid never prints the passwords).
            msg=$(grep -E 'CRITICAL|ERROR|Error|Traceback' -A3 "$RUNNER_TEMP/fdroid.log" | tail -n 20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=fdroid update failed::${msg:-see log}"
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.p12

      - name: Build the website
        run: python scripts/build_site.py "$FINGERPRINT"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
