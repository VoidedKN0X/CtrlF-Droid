name: Update F-Droid repo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 3 hours, so new app releases show up without any manual step
    - cron: "23 */3 * * *"

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Never build or publish two repo indexes at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the repo; app releases are fetched from public repos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install F-Droid tools
        # This job holds the repo signing key: fdroidserver, qrcode and everything they need are pinned
        # to exact versions with sha256 hashes, and pip refuses anything else.
        run: pip install --require-hashes -r .github/fdroid-requirements.txt

      - name: Check the listings
        # A quick read of apps.txt and every metadata/*.yml, so a typo in a listing
        # is named in the first seconds of the run instead of surfacing later.
        run: python scripts/check_metadata.py

      - name: Find apksigner
        # add_apk.py and `fdroid update` both verify APK signatures with this
        # apksigner. Without it fdroid would silently fall back to jarsigner, which
        # only checks old v1 signatures, so a missing apksigner stops the run.
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          bt=""
          for d in $(ls -1d "$sdk"/build-tools/*/ 2>/dev/null | sort -V -r); do
            v=$(basename "$d")
            case "$v" in 33.*) continue ;; esac  # 33.x passes some invalid v3 signatures
            if [[ "${v%%.*}" =~ ^[0-9]+$ ]] && [ "${v%%.*}" -ge 34 ] && [ -x "$d/apksigner" ]; then
              bt="${d%/}"
              break
            fi
          done
          if [ -z "$bt" ]; then
            echo "::error::No apksigner from build-tools 34 or newer found in the Android SDK"
            exit 1
          fi
          echo "$bt" >> "$GITHUB_PATH"
          echo "Using apksigner $("$bt/apksigner" --version) from $bt"

      - name: Download and check the latest APK and release notes of every app
        # Fails closed: only "this app has no release yet" (GitHub answers 404) or "its
        # latest release has no .apk" skips an app. Any other error is retried and then
        # stops the run, so a GitHub hiccup can't publish an index with an app missing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repo/icons
          cp assets/icon.png repo/icons/icon.png
          tries=4
          failed=0

          # Writes the latest release of repo $1 as JSON to file $2.
          # Returns 0 when it has one, 2 when it has none (HTTP 404), 1 on any other error.
          latest_release() {
            local n err="$RUNNER_TEMP/gh-api.err"
            for n in $(seq 1 "$tries"); do
              if gh api "repos/$1/releases/latest" > "$2" 2> "$err"; then
                return 0
              fi
              cat "$err" >&2
              if grep -q '(HTTP 404)' "$err"; then
                return 2
              fi
              if [ "$n" -lt "$tries" ]; then
                echo "Attempt $n of $tries failed; trying again in $((n * 15))s"
                sleep "$((n * 15))"
              fi
            done
            return 1
          }

          # Downloads every .apk of release $2 of repo $1 into the emptied folder $3.
          download_apks() {
            local n
            for n in $(seq 1 "$tries"); do
              rm -rf "$3" && mkdir -p "$3"
              if gh release download "$2" --repo "$1" --pattern '*.apk' --dir "$3"; then
                return 0
              fi
              if [ "$n" -lt "$tries" ]; then
                echo "Attempt $n of $tries failed; trying again in $((n * 15))s"
                sleep "$((n * 15))"
              fi
            done
            return 1
          }

          while read -r app; do
            if ! [[ "$app" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Bad line in apps.txt: $app"
              failed=1
              continue
            fi
            echo "::group::$app"
            dl="$RUNNER_TEMP/dl/${app#*/}"
            release="$RUNNER_TEMP/release.json"
            status=0
            latest_release "$app" "$release" || status=$?
            if [ "$status" = 2 ]; then
              # The published-apps check below still stops the run if this app is in the live repo.
              echo "::warning::$app has no release yet; skipped"
              echo "::endgroup::"
              continue
            elif [ "$status" != 0 ]; then
              echo "::error::Couldn't read the latest release of $app from GitHub after $tries attempts"
              failed=1
              echo "::endgroup::"
              break  # GitHub is having trouble; don't spend minutes retrying every other app
            fi
            tag=$(jq -r '.tag_name // ""' "$release")
            expected=$(jq -r '[.assets[]?.name | select(endswith(".apk"))] | length' "$release")
            if [ -z "$tag" ] || [[ "$tag" == -* ]]; then
              echo "::error::The latest release of $app has no usable tag"
              failed=1
              echo "::endgroup::"
              continue
            fi
            if [ "$expected" = 0 ]; then
              echo "::warning::No APK found in the latest release of $app; skipped"
              echo "::endgroup::"
              continue
            fi
            if ! download_apks "$app" "$tag" "$dl"; then
              echo "::error::Couldn't download the APK of $app after $tries attempts"
              failed=1
              echo "::endgroup::"
              break
            fi
            got=$(find "$dl" -maxdepth 1 -type f -name '*.apk' | wc -l)
            if [ "$got" != "$expected" ]; then
              echo "::error::Expected $expected APK(s) from the latest release of $app but got $got"
              failed=1
              echo "::endgroup::"
              continue
            fi
            # The release notes become the app's "What's new" in F-Droid clients.
            jq -r '.body // ""' "$release" > "$RUNNER_TEMP/notes.md"
            for apk in "$dl"/*.apk; do
              # Checks package name, source repo and signing certificate, then
              # moves the APK into repo/ under a safe name.
              python scripts/add_apk.py "$app" "$apk" "$RUNNER_TEMP/notes.md" repo || failed=1
            done
            echo "::endgroup::"
          done < <(grep -v '^#' apps.txt | sed '/^$/d')
          if [ "$failed" != 0 ]; then
            echo "::error::A download failed or an APK failed its checks. Nothing was signed or published; the current repo stays live."
            exit 1
          fi
          ls -la repo

      - name: Check that no published app would go missing
        # Compares the checked APKs with the index that is live right now, before the
        # signing key is touched. An app only leaves the repo when it is taken out of apps.txt.
        run: |
          set -euo pipefail
          python scripts/check_published.py fetch "$RUNNER_TEMP/published-index-v1.json"
          python scripts/check_published.py apks "$RUNNER_TEMP/published-index-v1.json" repo

      - name: Self-test the APK checks
        # Feeds forged copies of a real APK to the same checks and stops here,
        # before the signing key is touched, unless every one is rejected.
        run: |
          set -euo pipefail
          first=$(find repo -maxdepth 1 -name '*.apk' | sort | sed -n 1p)
          if [ -z "$first" ]; then
            echo "::error::No APKs were added; refusing to publish an empty repo"
            exit 1
          fi
          python scripts/selftest_apk_checks.py "$first" "$RUNNER_TEMP/selftest"

      - name: Set up the repo signing key
        env:
          REPO_KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ vars.REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$REPO_KEYSTORE_BASE64" ] || [ -z "$REPO_KEYSTORE_PASSWORD" ] || [ -z "$REPO_KEY_ALIAS" ]; then
            echo "::error::Missing REPO_KEYSTORE_BASE64 / REPO_KEYSTORE_PASSWORD secrets or the REPO_KEY_ALIAS variable"
            exit 1
          fi
          umask 077
          chmod 600 config.yml  # fdroid wants this whenever config.yml names a password, even via env
          printf '%s' "$REPO_KEYSTORE_BASE64" | base64 -d > keystore.p12
          # The password is read from the environment, never put on the command line.
          FP=$(keytool -exportcert -alias "$REPO_KEY_ALIAS" -keystore keystore.p12 \
                 -storetype PKCS12 -storepass:env REPO_KEYSTORE_PASSWORD \
               | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "Repo fingerprint: $FP"

      - name: Build and sign the repo index
        # config.yml reads the password and alias from these variables.
        env:
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ vars.REPO_KEY_ALIAS }}
        run: |
          set -o pipefail
          if ! fdroid update --use-date-from-apk --pretty 2>&1 | tee "$RUNNER_TEMP/fdroid.log"; then
            # Surface the reason as an annotation (fdroid never prints the passwords).
            msg=$(grep -E 'CRITICAL|ERROR|Error|Traceback' -A3 "$RUNNER_TEMP/fdroid.log" | tail -n 20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=fdroid update failed::${msg:-see log}"
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.p12

      - name: Check the new index against the published one
        # The same check again on the index fdroid just wrote: every app that is
        # live now and still in apps.txt must be in it, or nothing is published.
        run: python scripts/check_published.py index "$RUNNER_TEMP/published-index-v1.json" repo/index-v1.json

      - name: Build the website
        run: python scripts/build_site.py "$FINGERPRINT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the repo to GitHub Pages
      id-token: write  # Pages deployment proves it comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
