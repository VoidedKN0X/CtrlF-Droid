name: Workflow audit (zizmor)

# Checks the GitHub Actions workflows for security problems (injection, unpinned actions,
# leaked credentials, too-wide permissions). Runs offline, so it needs no token.
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install --require-hashes -r .github/zizmor-requirements.txt

      - name: Audit workflows
        run: zizmor --offline .github/workflows
