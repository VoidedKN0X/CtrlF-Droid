name: Render app icons

# The apps use vector (adaptive) launcher icons, which F-Droid can't read from
# the APK. This turns each app's icon into a 512px PNG store icon in
# metadata/<package>/en-US/icon.png, commits it if it changed, and rebuilds the repo.

on:
  push:
    branches: [main]
    paths:
      - apps.txt
      - scripts/render_icons.py
      - .github/workflows/render-icons.yml
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions: {}

concurrency:
  group: render-icons
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit the rendered icons
      actions: write   # start "Update F-Droid repo" afterwards
    steps:
      # No token is stored in .git/config while the app sources are cloned and
      # parsed; it is only given to the final push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the SVG renderer
        run: sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin

      - name: Render icons
        run: |
          set -euo pipefail
          while read -r app; do
            if ! [[ "$app" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Bad line in apps.txt: $app"
              exit 1
            fi
            name=${app#*/}
            git clone -q --depth 1 --filter=blob:none --no-checkout "https://github.com/$app" "src/$name"
            git -C "src/$name" sparse-checkout set --no-cone /app/src/main/res/ /app/build.gradle.kts
            git -C "src/$name" checkout -q
            # render_icons.py only prints a validated package name
            pkg=$(python scripts/render_icons.py "src/$name" "src/$name.svg")
            mkdir -p "metadata/$pkg/en-US"
            rsvg-convert -w 512 -h 512 "src/$name.svg" -o "metadata/$pkg/en-US/icon.png"
            echo "$app -> metadata/$pkg/en-US/icon.png"
          done < <(grep -v '^#' apps.txt | sed '/^$/d')
          rm -rf src

      - name: Commit changed icons and rebuild the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- 'metadata/*/en-US/icon.png'
          if git diff --cached --quiet; then
            echo "Icons unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app icons"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          gh workflow run update-repo.yml --ref main
